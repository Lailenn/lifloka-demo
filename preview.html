<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; form-action 'none'; connect-src 'none'; base-uri 'none'">
<title>LIFLOKA Tecnología | Portal empresarial</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#18344f;font:16px/1.5 system-ui,-apple-system,sans-serif;min-height:100vh;display:grid;place-items:center;padding:28px}main{width:100%;max-width:440px;background:white;border:1px solid #dbe5ed;border-radius:20px;padding:38px;box-shadow:0 18px 65px #17355012;border-top:6px solid #168899}.brand{font-size:28px;font-weight:800;letter-spacing:2px;margin:0}.technology{color:#138193;margin:0 0 22px}.tag{font-size:13px;background:#e7f5f6;color:#14616d;display:inline-block;border-radius:5px;padding:5px 10px}h1{font-size:24px;line-height:1.25;margin:18px 0 10px}.intro{color:#5b6a78;font-size:14px;margin:0 0 24px}label{display:block;font-size:14px;font-weight:650;margin:17px 0 7px}input{width:100%;border:1px solid #bdccd8;border-radius:8px;padding:13px;font:inherit;color:#18344f;background:#fbfcfe}input:focus{outline:3px solid #91d1dc;outline-offset:2px}button{font:inherit;font-weight:650;border:0;border-radius:8px;cursor:pointer;background:#163e66;color:white;padding:14px;width:100%;margin-top:24px}button:hover{background:#205480}button:focus-visible{outline:3px solid #138193;outline-offset:3px}.note{font-size:13px;color:#637282;text-align:center;margin:22px 0 0}#success{text-align:center;padding-top:18px}#success h2{font-size:24px}#success p{color:#5b6a78}footer{border-top:1px solid #e5ebf0;padding-top:18px;margin-top:27px;color:#647582;font-size:12px;text-align:center}[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<p class="brand">LIFLOKA</p><p class="technology">Tecnología</p>
<section id="entry">
<h1>Portal de acceso empresarial</h1>
<p class="intro">Bienvenido a LIFLOKA Tecnología.</p>
<form id="demo" autocomplete="off">
<label for="email">Correo electrónico</label>
<input id="email" type="email" placeholder="usuario@example.com" autocomplete="off" required aria-describedby="privacy">
<label for="password">Contraseña</label>
<input id="password" type="password" placeholder="Ingresá tu contraseña de prueba" autocomplete="new-password" required aria-describedby="privacy">
<button type="submit">Iniciar sesión</button>
</form>
<p class="note" id="privacy">Práctica académica. Usá únicamente datos ficticios.</p>
</section>
<section id="success" hidden role="status" aria-live="polite">
<h2 tabindex="-1" id="done">Formulario completado</h2>
<p>La interacción finalizó. No se guardaron ni transmitieron los datos ingresados.</p>
<button id="again" type="button">Volver al portal</button>
</section>
<footer>LIFLOKA Tecnología · Entorno académico</footer>
</main>
<script>
'use strict';
const form=document.getElementById('demo');
const entry=document.getElementById('entry');
const success=document.getElementById('success');
form.addEventListener('submit',function(event){
 event.preventDefault();
 document.getElementById('email').value='';
 document.getElementById('password').value='';
 entry.hidden=true;success.hidden=false;
 document.getElementById('done').focus();
});
document.getElementById('again').addEventListener('click',function(){
 form.reset();success.hidden=true;entry.hidden=false;
 document.getElementById('email').focus();
});
</script>
</body>
</html>
